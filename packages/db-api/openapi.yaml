      tags:
        - Group
      summary: Get all groups
      description: Retrieve a list of all groups with pagination.
      parameters:
        - name: page
          in: query
          description: Page number for pagination (default is 0)
          schema:
            type: integer
            example: 0
        - name: limit
          in: query
          description: Number of groups to fetch per page (default is 10)
          schema:
            type: integer
            example: 10
      responses:
        200:
          description: A list of groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  next:
                    type: boolean
                    description: Whether there are more groups to fetch
        500:
