openapi: 3.1.0
info:
  title: WakandansHR DB API,
  version: apiVersion,
  description: |
    The HR DB API is a RESTful API that provides access to the HR database.

    API possible responses: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status#client_error_responses

    Informational responses (100 - 199)

    Successful responses (200 - 299)

    Redirection messages (300 - 399)

    Client error responses (400 - 499)

    Server error responses (500 - 599)

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Location:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'New York Office'
        country:
          type: string
          example: 'US'
        city:
          type: string
          example: 'New York'
        address:
          type: string
          example: '5th Street - Building 100, first floor'
        workSetting:
          type: object
        users:
          type: array
          items:
            type: object
        departments:
          type: array
          items:
            type: object
        teams:
          type: array
          items:
            type: object
        groups:
          type: array
          items:
            type: object
        locationStatuses:
          type: array
          items:
            type: object
        daysOffLocation:
          type: array
          items:
            type: object
    LocationInput:
      type: object
      required:
        - name
        - country
        - city
        - address
      properties:
        name:
          type: string
          example: 'New York Office'
        country:
          type: string
          example: 'US'
        city:
          type: string
          example: 'New York'
        address:
          type: string
          example: '5th Street - Building 100, first floor'
        workSettingId:
          type: integer
          example: 2
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locationId:
          type: integer
          nullable: true
        companyId:
          type: integer
        deletedAt:
          type: string
          format: date-time
          nullable: true
    TeamInput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        locationId:
          type: integer
          nullable: true
        companyId:
          type: integer
    MinimalUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        role:
          type: string
          example: 'Admin'
          enum:
            - Admin
            - User
        location:
          $ref: '#/components/schemas/Location'
        reportsTo:
          type: object
          properties:
            id:
              type: integer
              example: 2
            firstName:
              type: string
              example: 'Jane'
            lastName:
              type: string
              example: 'Smith'
    UserInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        role:
          type: string
          example: 'User'
          enum:
            - Admin
            - User
        locationId:
          type: integer
          example: 3
        reportsToId:
          type: integer
          example: 2
    MinimalDepartment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Engineering'
    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Engineering'
        description:
          type: string
          example: 'Handles all engineering tasks.'
        locationId:
          type: integer
          example: 5
    DepartmentCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: 'Engineering'
        description:
          type: string
          example: 'Handles all engineering tasks.'
        locationId:
          type: integer
          example: 5
    DepartmentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: 'Updated Department Name'
        description:
          type: string
          example: 'Updated description of the department.'
    UserDepartmentRequest:
      type: object
      properties:
        userId:
          type: integer
          example: 87
        departmentId:
          type: integer
          example: 4
    UserInDepartment:
      type: object
      properties:
        id:
          type: integer
          example: 87
        firstName:
          type: string
          example: 'Youssef'
        lastName:
          type: string
          example: 'Issa'
        email:
          type: string
          example: 'ysf@test.com'
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Operation completed successfully.'
    UserTeamResponse:
      type: object
      properties:
        message:
          type: string
          example: 'User successfully assigned to the team'
        data:
          type: object
          properties:
            userId:
              type: integer
              example: 1
            teamId:
              type: integer
              example: 101
            active:
              type: boolean
              example: true
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Engineering Team
        description:
          type: string
          example: A group focused on engineering tasks.
        locationId:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-01T12:30:00Z'
    GroupInput:
      type: object
      properties:
        name:
          type: string
          example: Marketing Team
        description:
          type: string
          example: A group for marketing initiatives.
        locationId:
          type: integer
          example: 3
    WorkSetting:
      type: object
      properties:
        id:
          type: integer
        remoteWorkAllowed:
          type: boolean
        hybridWorkAllowed:
          type: boolean
        inOfficeAvailable:
          type: boolean
        flexibleHours:
          type: boolean
        partTime:
          type: boolean
        timeZone:
          type: string
        workingSchedule:
          type: object
          description: JSON object representing the working schedule.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        maxDaysOffPerYear:
          type: integer
        maxOooMinsPerDay:
          type: integer
        pdAllowancePerYear:
          type: integer
    CreateWorkSetting:
      type: object
      required:
        - timeZone
        - workingSchedule
      properties:
        remoteWorkAllowed:
          type: boolean
          default: false
        hybridWorkAllowed:
          type: boolean
          default: false
        inOfficeAvailable:
          type: boolean
          default: true
        flexibleHours:
          type: boolean
          default: false
        partTime:
          type: boolean
          default: false
        timeZone:
          type: string
        workingSchedule:
          type: object
          description: JSON object representing the working schedule.
        maxDaysOffPerYear:
          type: integer
          default: 20
        maxOooMinsPerDay:
          type: integer
          default: 149
        pdAllowancePerYear:
          type: integer
          default: 1000
security:
  - cookieAuth: []
paths:
  /locations:
    get:
      summary: Get all locations
      tags:
        - Locations
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: A list of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        500:
          description: Internal server error
    post:
      summary: Create a new location
      tags:
        - Locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        201:
          description: Location created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
  /locations/count:
    get:
      summary: Retrieves the count of locations
      tags:
        - Locations
      responses:
        200:
          description: The count of locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 10
  /locations/{locationId}:
    get:
      summary: Retrieve a specific location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      responses:
        200:
          description: A location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        404:
          description: Location not found
    put:
      summary: Update a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        200:
          description: Location updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: 'Location updated successfully'
    delete:
      summary: Delete a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      responses:
        200:
          description: Location deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: 'Location deleted successfully'
  /login:
    post:
      summary: Generate a login token for a user
      tags:
        - Authentication
      requestBody:
        description: The email address of the user requesting a login token
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
      security: []
      responses:
        200:
          description: Login token generated and email job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login token generated and email job created successfully'
  /validate-token:
    post:
      summary: Validate a login token
      tags:
        - Authentication
      requestBody:
        description: The email address and login token to validate
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                loginToken:
                  type: string
                  example: '4c2fdef7-9d3b-4c2d-a1b6-9c2bfc51900b'
      security: []
      responses:
        200:
          description: Login token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login token is valid'
  /logout:
    post:
      summary: User logout
      tags:
        - Authentication
      requestBody:
        description: No request body required.
        required: false
        content: {}
      responses:
        '200':
          description: Successfully logged out.
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Fetch a paginated list of users.
      parameters:
        - name: page
          in: query
          description: The page number (0-based).
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: The number of users to retrieve per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Successful response with user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MinimalUser'
                  next:
                    type: boolean
                    description: Indicates if there are more pages.
        500:
          description: Server error
    post:
      tags:
        - Users
      summary: Create a new user
      description: Add a new user to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        500:
          description: Server error
  /candidates:
    get:
      summary: Get all candidates
      tags:
        - Candidates
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: A list of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    firstName:
                      type: string
                      example: 'John'
                    lastName:
                      type: string
                      example: 'Doe'
                    email:
                      type: string
                      example: 'user@example.com'
                    phone:
                      type: string
                      example: '1234567890'
                    resume:
                      type: string
                      example: 'http://example.com/resume.pdf'
                    status:
                      type: string
                      example: 'Pending'

  /pipeline-stages:
    get:
      summary: Get all pipeline stages
      tags:
        - Pipeline Management
      responses:
        200:
          description: A list of pipeline stages with candidate counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Initial Interview'
                        order:
                          type: integer
                          example: 1
                        description:
                          type: string
                          example: 'First stage of the interview process'
                        _count:
                          type: object
                          properties:
                            candidates:
                              type: integer
                              example: 5
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Error occurred while fetching pipeline stages'

  /pipeline-stages/{id}:
    get:
      summary: Get pipeline stage details
      tags:
        - Pipeline Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Pipeline stage ID
      responses:
        200:
          description: Detailed information about a pipeline stage including candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Initial Interview'
                      order:
                        type: integer
                        example: 1
                      description:
                        type: string
                        example: 'First stage of the interview process'
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            firstName:
                              type: string
                              example: 'John'
                            lastName:
                              type: string
                              example: 'Doe'
                            email:
                              type: string
                              example: 'john.doe@example.com'
                            status:
                              type: string
                              example: 'INITIAL'
                            createdAt:
                              type: string
                              format: date-time
                      _count:
                        type: object
                        properties:
                          candidates:
                            type: integer
                            example: 5
        400:
          description: Invalid stage ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid stage ID: abc'
        404:
          description: Stage not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Stage with ID 123 not found'
        500:
          description: Internal server error

  /pipeline-stages/reorder:
    put:
      summary: Reorder pipeline stages
      tags:
        - Pipeline Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stageOrders:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      order:
                        type: integer
                        example: 2
              required:
                - stageOrders
      responses:
        200:
          description: Stages reordered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Pipeline stages reordered successfully'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Initial Interview'
                        order:
                          type: integer
                          example: 2
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid stage orders format'
        500:
          description: Internal server error

  /candidates/{id}/stage:
    put:
      summary: Move candidate to a new stage
      tags:
        - Pipeline Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Candidate ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stageId
              properties:
                stageId:
                  type: integer
                  example: 2
                notes:
                  type: string
                  example: 'Candidate performed well in technical interview'
      responses:
        200:
          description: Candidate moved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Candidate moved successfully'
                  data:
                    type: object
                    properties:
                      candidate:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          firstName:
                            type: string
                            example: 'John'
                          lastName:
                            type: string
                            example: 'Doe'
                          pipelineStageId:
                            type: integer
                            example: 2
                          pipelineStage:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2
                              name:
                                type: string
                                example: 'Technical Interview'
                      history:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          candidateId:
                            type: integer
                            example: 1
                          fromStageId:
                            type: integer
                            example: 1
                          toStageId:
                            type: integer
                            example: 2
                          notes:
                            type: string
                            example: 'Candidate performed well in technical interview'
                          createdAt:
                            type: string
                            format: date-time
        400:
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid candidate or stage ID'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User must be authenticated to perform this action'
        404:
          description: Candidate not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Candidate not found'
        500:
          description: Internal server error

  /candidates/by-stage:
    get:
      summary: Get candidates grouped by pipeline stage
      tags:
        - Pipeline Management
      responses:
        200:
          description: Candidates grouped by stage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Initial Screen'
                        order:
                          type: integer
                          example: 1
                        candidates:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              firstName:
                                type: string
                                example: 'John'
                              lastName:
                                type: string
                                example: 'Doe'
                              email:
                                type: string
                                example: 'john.doe@example.com'
                              status:
                                type: string
                                example: 'INITIAL'
                              tags:
                                type: array
                                items:
                                  type: string
                                example: ['JavaScript', 'React']
                              createdAt:
                                type: string
                                format: date-time
                              updatedAt:
                                type: string
                                format: date-time
                        _count:
                          type: object
                          properties:
                            candidates:
                              type: integer
                              example: 3
        500:
          description: Internal server error

  /candidates/{id}/history:
    get:
      summary: Get stage history for a candidate
      tags:
        - Pipeline Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        200:
          description: Candidate's stage history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        candidateId:
                          type: integer
                          example: 1
                        fromStage:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Initial Screen'
                        toStage:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                            name:
                              type: string
                              example: 'Technical Interview'
                        notes:
                          type: string
                          example: 'Candidate moved to technical interview phase'
                        createdAt:
                          type: string
                          format: date-time
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            firstName:
                              type: string
                              example: 'HR'
                            lastName:
                              type: string
                              example: 'Manager'
                            email:
                              type: string
                              example: 'hr@example.com'
        400:
          description: Invalid candidate ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid candidate ID'
        500:
          description: Internal server error

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      description: Fetch details of a specific user by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to retrieve.
          schema:
            type: integer
      responses:
        200:
          description: Successful response with user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found
        500:
          description: Server error
    put:
      tags:
        - Users
      summary: Update a user
      description: Update details of a specific user by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to update.
          schema:
            type: integer
      requestBody:
        required: true
        content:
