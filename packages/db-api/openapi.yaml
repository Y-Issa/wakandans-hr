openapi: 3.1.0
info:
  title: WakandansHR DB API,
  version: apiVersion,
  description: |
    The HR DB API is a RESTful API that provides access to the HR database.

    API possible responses: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status#client_error_responses

    Informational responses (100 - 199)

    Successful responses (200 - 299)

    Redirection messages (300 - 399)

    Client error responses (400 - 499)

    Server error responses (500 - 599)

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
security:
  - cookieAuth: []
paths:
  /hello:
    get:
      summary: A simple hello world endpoint
      tags:
        - Hello
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Hello, World!'
  /locations:
    get:
      summary: Get all locations
      tags:
        - Locations
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: A list of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: 'New York Office'
                    country:
                      type: string
                      example: 'US'
                    city:
                      type: string
                      example: 'New York'
                    address:
                      type: string
                      example: '5th Street - Building 100, first floor'
    post:
      summary: Create a new location
      tags:
        - Locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'New York Office'
                country:
                  type: string
                  example: 'US'
                city:
                  type: string
                  example: 'New York'
                address:
                  type: string
                  example: '5th Street - Building 100, first floor'
                workSettingId:
                  type: integer
                  example: 2
      responses:
        201:
          description: Location created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
  /locations/count:
    get:
      summary: Retrieves the count of locations
      tags:
        - Locations
      responses:
        200:
          description: The count of departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 10
  /locations/{locationId}:
    get:
      summary: Retrieve a specific location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the location
      responses:
        200:
          description: A location
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'New York Office'
                  country:
                    type: string
                    example: 'US'
                  city:
                    type: string
                    example: 'New York'
                  address:
                    type: string
                    example: '5th Street - Building 100, first floor'
                  workSetting:
                    type: object
                  users:
                    type: array
                    items:
                      type: object
                  departments:
                    type: array
                    items:
                      type: object
                  teams:
                    type: array
                    items:
                      type: object
                  groups:
                    type: array
                    items:
                      type: object
                  locationStatuses:
                    type: array
                    items:
                      type: object
                  daysOffLocation:
                    type: array
                    items:
                      type: object
    put:
      summary: Update a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'New York Office'
                country:
                  type: string
                  example: 'US'
                city:
                  type: string
                  example: 'New York'
                address:
                  type: string
                  example: '5th Street - Building 100, first floor'
                workSettingId:
                  type: integer
                  example: 2
      responses:
        200:
          description: Location updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: 'Location updated successfully'
    delete:
      summary: Delete a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the location
      responses:
        200:
          description: Location deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: 'Location deleted successfully'
  /login:
    post:
      summary: Generate a login token for a user
      tags:
        - Authentication
      requestBody:
        description: The email address of the user requesting a login token
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
      security: []
      responses:
        200:
          description: Login token generated and email job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login token generated and email job created successfully'
  /validate-token:
    post:
      summary: Validate a login token
      tags:
        - Authentication
      requestBody:
        description: The email address and login token to validate
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                loginToken:
                  type: string
                  example: '4c2fdef7-9d3b-4c2d-a1b6-9c2bfc51900b'
      security: []
      responses:
        200:
          description: Login token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login token is valid'
  /logout:
    post:
      summary: User logout
      tags:
        - Authentication
      requestBody:
        description: No request body required.
        required: false
        content: {}
      responses:
        '200':
          description: Successfully logged out.
