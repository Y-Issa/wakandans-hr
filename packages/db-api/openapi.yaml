openapi: 3.1.0
info:
  title: WakandansHR DB API,
  version: apiVersion,
  description: |
    The HR DB API is a RESTful API that provides access to the HR database.

    API possible responses: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status#client_error_responses

    Informational responses (100 - 199)

    Successful responses (200 - 299)

    Redirection messages (300 - 399)

    Client error responses (400 - 499)

    Server error responses (500 - 599)

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Location:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'New York Office'
        country:
          type: string
          example: 'US'
        city:
          type: string
          example: 'New York'
        address:
          type: string
          example: '5th Street - Building 100, first floor'
        workSetting:
          type: object
        users:
          type: array
          items:
            type: object
        departments:
          type: array
          items:
            type: object
        teams:
          type: array
          items:
            type: object
        groups:
          type: array
          items:
            type: object
        locationStatuses:
          type: array
          items:
            type: object
        daysOffLocation:
          type: array
          items:
            type: object
    LocationInput:
      type: object
      required:
        - name
        - country
        - city
        - address
      properties:
        name:
          type: string
          example: 'New York Office'
        country:
          type: string
          example: 'US'
        city:
          type: string
          example: 'New York'
        address:
          type: string
          example: '5th Street - Building 100, first floor'
        workSettingId:
          type: integer
          example: 2
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locationId:
          type: integer
          nullable: true
        companyId:
          type: integer
        deletedAt:
          type: string
          format: date-time
          nullable: true
    TeamInput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        locationId:
          type: integer
          nullable: true
        companyId:
          type: integer
    MinimalUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        role:
          type: string
          example: 'Admin'
          enum:
            - Admin
            - User
        location:
          $ref: '#/components/schemas/Location'
        reportsTo:
          type: object
          properties:
            id:
              type: integer
              example: 2
            firstName:
              type: string
              example: 'Jane'
            lastName:
              type: string
              example: 'Smith'
    UserInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        role:
          type: string
          example: 'User'
          enum:
            - Admin
            - User
        locationId:
          type: integer
          example: 3
        reportsToId:
          type: integer
          example: 2
    MinimalDepartment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Engineering'
    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Engineering'
        description:
          type: string
          example: 'Handles all engineering tasks.'
        locationId:
          type: integer
          example: 5
    DepartmentCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: 'Engineering'
        description:
          type: string
          example: 'Handles all engineering tasks.'
        locationId:
          type: integer
          example: 5
    DepartmentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: 'Updated Department Name'
        description:
          type: string
          example: 'Updated description of the department.'
    UserDepartmentRequest:
      type: object
      properties:
        userId:
          type: integer
          example: 87
        departmentId:
          type: integer
          example: 4
    UserInDepartment:
      type: object
      properties:
        id:
          type: integer
          example: 87
        firstName:
          type: string
          example: 'Youssef'
        lastName:
          type: string
          example: 'Issa'
        email:
          type: string
          example: 'ysf@test.com'
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Operation completed successfully.'
    UserTeamResponse:
      type: object
      properties:
        message:
          type: string
          example: 'User successfully assigned to the team'
        data:
          type: object
          properties:
            userId:
              type: integer
              example: 1
            teamId:
              type: integer
              example: 101
            active:
              type: boolean
              example: true
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Engineering Team
        description:
          type: string
          example: A group focused on engineering tasks.
        locationId:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-01T12:30:00Z'
    GroupInput:
      type: object
      properties:
        name:
          type: string
          example: Marketing Team
        description:
          type: string
          example: A group for marketing initiatives.
        locationId:
          type: integer
          example: 3
security:
  - cookieAuth: []
paths:
  /locations:
    get:
      summary: Get all locations
      tags:
        - Locations
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: A list of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        500:
          description: Internal server error
    post:
      summary: Create a new location
      tags:
        - Locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        201:
          description: Location created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
  /locations/count:
    get:
      summary: Retrieves the count of locations
      tags:
        - Locations
      responses:
        200:
          description: The count of locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 10
  /locations/{locationId}:
    get:
      summary: Retrieve a specific location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      responses:
        200:
          description: A location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        404:
          description: Location not found
    put:
      summary: Update a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        200:
          description: Location updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: "Location updated successfully"
    delete:
      summary: Delete a location by ID
      tags:
        - Locations
      parameters:
        - name: locationId
          in: path
          required: true
          description: The ID of the location
          schema:
            type: integer
      responses:
        200:
          description: Location deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: "Location deleted successfully"
  /login:
    post:
      summary: Generate a login token for a user
      tags:
        - Authentication
      requestBody:
        description: The email address of the user requesting a login token
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      security: []
      responses:
        200:
          description: Login token generated and email job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login token generated and email job created successfully"
  /validate-token:
    post:
      summary: Validate a login token
      tags:
        - Authentication
      requestBody:
        description: The email address and login token to validate
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                loginToken:
                  type: string
                  example: "4c2fdef7-9d3b-4c2d-a1b6-9c2bfc51900b"
      security: []
      responses:
        200:
          description: Login token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login token is valid"
  /logout:
    post:
      summary: User logout
      tags:
        - Authentication
      requestBody:
        description: No request body required.
        required: false
        content: {}
      responses:
        "200":
          description: Successfully logged out.
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Fetch a paginated list of users.
      parameters:
        - name: page
          in: query
          description: The page number (0-based).
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: The number of users to retrieve per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Successful response with user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MinimalUser"
                  next:
                    type: boolean
                    description: Indicates if there are more pages.
        500:
          description: Server error
    post:
      tags:
        - Users
      summary: Create a new user
      description: Add a new user to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        500:
          description: Server error
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      description: Fetch details of a specific user by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to retrieve.
          schema:
            type: integer
      responses:
        200:
          description: Successful response with user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        404:
          description: User not found
        500:
          description: Server error
    put:
      tags:
        - Users
      summary: Update a user
      description: Update details of a specific user by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to update.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        200:
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: Invalid user ID
        500:
          description: Server error
    delete:
      tags:
        - Users
      summary: Soft delete a user
      description: Mark a user as inactive and set a deletion timestamp.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to soft delete.
          schema:
            type: integer
      responses:
        200:
          description: User soft-deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: Invalid user ID
        500:
          description: Server error
  /departments:
    get:
      summary: Get all departments
      tags:
        - Departments
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A list of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinimalDepartment"
        "500":
          description: Internal server error
    post:
      summary: Create a new department
      tags:
        - Departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
      responses:
        "201":
          description: Department created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinimalDepartment"
        "400":
          description: Bad request
        "500":
          description: Internal server error
  /departments/{departmentId}:
    get:
      summary: Retrieve a specific department by ID
      tags:
        - Departments
      parameters:
        - name: departmentId
          in: path
          required: true
          description: ID of the department
          schema:
            type: integer
      responses:
        "200":
          description: A department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Department not found
    put:
      summary: Update a department by ID
      tags:
        - Departments
      parameters:
        - name: departmentId
          in: path
          required: true
          description: ID of the department
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdateRequest'
      responses:
        "200":
          description: Department updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinimalDepartment"
        "400":
          description: Invalid department ID
        "500":
          description: Internal server error
    delete:
      summary: Soft delete a department by ID
      tags:
        - Departments
      parameters:
        - name: departmentId
          in: path
          required: true
          description: ID of the department
          schema:
            type: integer
      responses:
        "200":
          description: Department soft-deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid department ID
        "500":
          description: Internal server error
  /userDepartments:
    post:
      summary: Assign a user to a department
      description: Creates a user-department relationship, assigning a user to a department.
      tags:
        - UserDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDepartmentRequest'
      responses:
        "200":
          description: User successfully assigned to department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request, invalid data
        "404":
          description: User or department not found
        "500":
          description: Internal server error
  /userDepartments/user/{userId}:
    get:
      summary: Get all departments assigned to a user
      description: Retrieves all departments that a user is assigned to.
      tags:
        - UserDepartment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user whose departments are being retrieved
      responses:
        "200":
          description: List of departments assigned to user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalDepartment'
        '404':
          description: User not found
        "500":
          description: Internal server error
  /userDepartments/department/{departmentId}:
    get:
      summary: Get all users assigned to a department
      description: Retrieves all users assigned to a particular department.
      tags:
        - UserDepartment
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the department whose users are being retrieved
      responses:
        "200":
          description: List of users assigned to department
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInDepartment'
        '404':
          description: Department not found
        "500":
          description: Internal server error
  /userDepartments/user/{userId}/department/{departmentId}:
    delete:
      summary: Remove a user from a department
      description: Deletes the user-department relationship, effectively removing the user from the department.
      tags:
        - UserDepartment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user to be removed from the department
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the department from which the user will be removed
      responses:
        "200":
          description: User successfully removed from department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: User or department not found
        '500':
          description: Internal server error
  /teams:
    get:
      summary: Get all teams
      tags:
        - Teams
      parameters:
        - name: page
          in: query
          description: 'Page number (default: 0)'
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: 'Number of teams per page (default: 10)'
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '500':
          description: Internal server error
    post:
      summary: Create a new team
      description: Create a new team with the given details.
      tags:
        - Teams
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        201:
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        400:
          description: Invalid input
        401:
          description: Unauthorized
        500:
          description: Server error
  /teams/{id}:
    get:
      summary: Get a team by ID
      description: Retrieve a specific team by its ID.
      tags:
        - Teams
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the team
          schema:
            type: integer
      responses:
        200:
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        401:
          description: Unauthorized
        404:
          description: Team not found
        500:
          description: Server error
    put:
      summary: Update a team
      description: Update the details of an existing team by ID.
      tags:
        - Teams
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the team to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        200:
          description: Team updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        400:
          description: Invalid input
        401:
          description: Unauthorized
        404:
          description: Team not found
        500:
          description: Server error
    delete:
      summary: Delete (soft delete) a team
      description: Soft delete a team by marking it as inactive and setting the `deletedAt` field.
      tags:
        - Teams
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the team to delete
          schema:
            type: integer
      responses:
        200:
          description: Team deleted successfully
        401:
          description: Unauthorized
        404:
          description: Team not found
        500:
          description: Server error
  /userTeams:
    post:
      summary: Assign a user to a team
      description: Creates a user-team relationship, assigning a user to a team.
      tags:
        - UserTeams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: The ID of the user
                  example: 1
                teamId:
                  type: integer
                  description: The ID of the team
                  example: 101
                active:
                  type: boolean
                  description: 'Whether the user is actively assigned to the team (default: true)'
                  example: true
      responses:
        '201':
          description: User successfully assigned to the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTeamResponse'
        '400':
          description: Bad request (missing or invalid parameters)
        '409':
          description: User is already assigned to the team
        '500':
          description: Internal server error
  /userTeams/user/{userId}:
    get:
      summary: Get all teams assigned to a user
      description: Retrieves all teams that a user is assigned to.
      tags:
        - UserTeams
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of teams assigned to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '404':
          description: User not found
        '500':
          description: Internal server error
  /userTeams/team/{teamId}:
    get:
      summary: Get all users assigned to a team
      description: Retrieves all users assigned to a particular team.
      tags:
        - UserTeams
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: List of users assigned to the team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Team not found
        '500':
          description: Internal server error
  /userTeams/user/{userId}/team/{teamId}:
    delete:
      summary: Remove a user from a team
      description: Deletes the user-team relationship, effectively removing the user from the team.
      tags:
        - UserTeams
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: User successfully removed from the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTeamResponse'
        '404':
          description: User or team not found
        '500':
          description: Internal server error
  /groups:
