  /userGroups:
    post:
      summary: Assign a user to a group
      description: Assign a user to a group. If the user is already assigned, their status will be updated to active.
      tags:
        - User Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - groupId
              properties:
                userId:
                  type: integer
                  description: The ID of the user.
                groupId:
                  type: integer
                  description: The ID of the group.
                active:
                  type: boolean
                  description: Indicates if the user is active in the group. Defaults to true.
      responses:
        '201':
          description: User successfully assigned to group.
        '400':
          description: Missing required fields.
        '409':
          description: User is already assigned to this group.
        '500':
          description: Server error.

